[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-platform-api"
version = "1.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools]
package-dir = { "" = "platform" }

[tool.setuptools.packages.find]
where = ["platform"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["platform"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["platform/app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
