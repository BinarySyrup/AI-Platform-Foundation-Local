[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-platform-api"
version = "1.0.0beta"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools]
package-dir = {"" = "platform"}

[tool.setuptools.packages.find]
where = ["platform"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["platform"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a running Ollama service and installed model"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["platform/app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
